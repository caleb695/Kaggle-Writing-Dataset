[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "writing-dataset"
version = "0.1.0"
description = "Boundary-respecting chunker and dataset builder for continued pretraining of Mistral Minimistral-3 14B Base"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mistral-common>=1.8.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-docx>=1.1",
    "PyYAML>=6.0",
    "regex>=2023.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
hf = ["datasets>=2.19"]
mobi = ["mobi>=0.3.3"]
dev = ["pytest>=7.4"]

[project.scripts]
writing-dataset = "writing_dataset.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
